
onboarding = false

[keys]
prefix = "ctrl+g"

focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"

swap_pane_left  = "prefix+shift+h"
swap_pane_down  = "prefix+shift+j"
swap_pane_up    = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

resize_mode = "prefix+r"

split_vertical   = ['prefix+%', 'prefix+v']
split_horizontal = ['prefix+"', 'prefix+minus']
close_pane = "prefix+x"
zoom       = "prefix+z"

copy_mode       = "prefix+["
edit_scrollback = "prefix+e"

new_tab      = "prefix+c"
next_tab     = "prefix+n"
previous_tab = "prefix+p"
switch_tab   = "prefix+1..9"
rename_tab   = ["prefix+comma", "prefix+shift+t"]
close_tab    = ["prefix+ampersand", "prefix+shift+x"]

workspace_picker = ["prefix+s", "prefix+w"]
new_workspace    = "prefix+shift+n"
rename_workspace = ['prefix+$', 'prefix+shift+w']
goto             = "prefix+g"
toggle_sidebar   = "prefix+b"
settings         = "prefix+shift+s"

navigate_workspace_up   = ["up", "k"]
navigate_workspace_down = ["down", "j"]

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "navigate left (nvim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "navigate down (nvim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "navigate up (nvim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "navigate right (nvim/herdr)"

[[keys.command]]
key = "prefix+ctrl+h"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "resize left"

[[keys.command]]
key = "prefix+ctrl+j"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "resize down"

[[keys.command]]
key = "prefix+ctrl+k"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "resize up"

[[keys.command]]
key = "prefix+ctrl+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "resize right"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "resize left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "resize down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "resize up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "resize right"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"

[theme]
name = "catppuccin"
auto_switch = false

[terminal]
new_cwd = "follow"

[ui]
mouse_capture = true
copy_on_select = false
pane_borders = true
pane_gaps = false
prompt_new_tab_name = false

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [{ token = "$sys_date", dim = true }, { token = "$sys_time", bold = true }],
]

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent"],
]

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true

[advanced]
scrollback_limit_bytes = 50000000

[worktrees]
directory = "~/.herdr/worktrees"
