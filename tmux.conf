set-option -sa terminal-overrides ",xterm*:Tc"

set -s set-clipboard on
set -sg repeat-time 600                   # increase repeat timeout
set -s focus-events on

set -q -g status-utf8 on                  # expect UTF-8 (tmux < 2.2)
setw -q -g utf8 on


# reload configuration
bind-key -r C-h resize-pane -L 3 
bind-key -r C-j resize-pane -D 3
bind-key -r C-k resize-pane -U 3
bind-key -r C-l resize-pane -R 3

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key H  swap-window -t -1
bind-key L swap-window -t +1

bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind-key -T copy-mode-vi 'C-h' if -F '#{pane_at_left}' '' 'select-pane -L'
bind-key -T copy-mode-vi 'C-j' if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'C-k' if -F '#{pane_at_top}' '' 'select-pane -U'
bind-key -T copy-mode-vi 'C-l' if -F '#{pane_at_right}' '' 'select-pane -R'

bind-key -n 'C-h' { if -F '#{pane_at_left}' '' 'select-pane -L' }
bind-key -n 'C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'C-k' { if -F '#{pane_at_top}' '' 'select-pane -U' }
bind-key -n 'C-l' { if -F '#{pane_at_right}' '' 'select-pane -R' }

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
unbind C-b
bind-key C-n new-session -n ""

bind r source-file ~/.tmux.conf \; display "Reloaded!"

# -- plugins -------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_with_mouse off   # don't auto-copy mouse selections to the clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-vim 'session'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @plugin 'christoomey/vim-tmux-navigator'

# -- configs -------------------------------------------------------------------

set-window-option -g mode-keys vi
set -g mode-keys vi
set -g prefix C-g
bind C-g send-prefix       # press prefix twice to send a literal C-g
set -g mouse off
set -s escape-time 0       # no delay after pressing Escape

# don't let a mouse selection auto-copy to the system clipboard (avoids a
# focus-click clobbering the clipboard); highlight only, press y to copy
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection

# -- display -------------------------------------------------------------------

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows
set-window-option -g pane-base-index 1

setw -g automatic-rename off   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1500      # slightly longer status messages display time
set-option -g history-limit 250000

set -g status-interval 10     # redraw status line every 10 seconds

# clear both screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

# activity
set -g monitor-activity on
set -g visual-activity off

######################
### DESIGN CHANGES ###
######################

# The panes {
set -g pane-border-style bg=colour236,fg=colour254
set -g pane-active-border-style bg=colour236,fg=colour038
# }

# The statusbar {
set -g status-justify left
set -g status-interval 2
set -g status-position bottom

# -- catppuccin (official) theme + status modules --
set -g @catppuccin_flavor 'mocha'                 # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'              # show window name (#W), not pane title (#T)
set -g @catppuccin_window_current_text ' #W'

# themed date_time module, kept on LA time (box is on Mountain time)
set -g @catppuccin_date_time_text '#(TZ="America/Los_Angeles" date +"%%H:%%M %%d-%%b-%%y")'

set -g status-left-length 100
set -g status-right-length 100
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_session}'
set -ag status-right '#{E:@catppuccin_status_date_time}'

setw -g renumber-windows on
# }


# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none
# }

run '~/.tmux/plugins/tpm/tpm'
