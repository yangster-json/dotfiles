[hostProfiles]
dev-jasyang = "fw-work"
dev-jasyang-sim = "fw-work"

# tiers: top/mid/low. default = main model id (provider-relative)
[profiles.default.models]
provider = "openai-codex"
default = "gpt-6-sol"
top = "openai-codex/gpt-6-astra"
mid = "openai-codex/gpt-6-sol"
low = "openai-codex/gpt-6-luna"

[profiles.fw-work.models]
provider = "gpulab"
default = "claude-opus-5-5"
top = "gpulab/claude-opus-5-5"
mid = "gpulab/gpt-6-sol-claude-compatible[1m]"
low = "gpulab/gpt-6-luna-claude-compatible[1m]"
