# sdd pipeline — single source of truth for how /sdd:run executes.
# this is the sdd plugin's bundled pipeline (${CLAUDE_PLUGIN_ROOT}/pipeline.yaml);
# a project may override it with its own .claude/sdd/pipeline.yaml (/sdd:run
# prefers the project copy).
# edit this file to reshape the pipeline (stages, gates, routing).
# edit the plugin's agents/*.md to reshape agent behavior — MODELS AND EFFORT
# ARE PINNED THERE, in each agent's frontmatter; stage entries below name
# agents, never models.
# /sdd:run interprets this file top to bottom, resuming from the phase in
# specs/<slug>/state.md.

config:
  # repo-relative; the authoritative standard
  coding_standard: docs/coding_standard.md

  # one-time distillation of the coding standard + comment style (~50 lines),
  # shared across features. generated at the start of the first implement
  # stage if missing (see that stage's setup). implementers and verifiers
  # read THIS instead of the full standard — it is the SINGLE source for
  # style rules in agent context (comment style included; agent files do not
  # restate it) — and consult the full doc only where the digest is silent
  # or ambiguous.
  standards_digest: specs/standards-digest.md

  # derived from repo commit history. the fw-commit skill enforces this when
  # installed; the inline fallback in the commit stage follows it manually.
  # change-id is added by the gerrit hook — never fabricate it.
  commit_standard: |
    FW-XXXXX: <imperative summary, under 72 chars>

    - <bullet per logical change>

    Reasoning:
    <only when the why is not obvious from the diff>

    JIRA: FW-XXXXX
    Test-Coverage: <tests that prove the change>
    Requirements: <R-numbers this commit implements, from specs/<slug>/spec.md>

  # matches the comment style in the repo's history. this is the SOURCE the
  # standards digest is distilled from — implementers read the digest, not
  # this block, so a project override here takes effect via regeneration
  # (delete the digest to force it).
  comment_style: |
    - lowercase, short, rare — only where the code can't say it
      e.g.  // sum up nvme io stats
            // only set led if state is different
    - multi-line rationale blocks only for non-obvious constraints
      (alignment, timing, hw quirks, flaky-test workarounds) — still lowercase
    - never touch structural markers:
      // ::pure_astyle_formatted::   and   #endif // !UNIT_TEST

  # accumulated lessons the pipeline reads before spawns and appends to on
  # mistakes, so it stops repeating them. TWO scopes: project (this
  # codebase's quirks) and global (pipeline/agent lessons that recur on any
  # codebase). template $(sdd-path templates/learning.md). the read/write
  # mechanics, scope-selection rule, and INDEX.md line format live in run.md's
  # "## learnings" — the single source, not restated here.
  learnings:
    project: sdd-git learnings-dir            # run it; stdout is the directory
                                              # (<claude-config>/sdd-learnings/<munged-repo>,
                                              # keyed to the main checkout —
                                              # never in the project's own tree)
    global: sdd-git learnings-dir --global    # run it; stdout is the shared
                                              # cross-project directory
                                              # (<claude-config>/sdd-learnings/_global).
                                              # both live outside the plugin
                                              # cache, so /plugin update never
                                              # wipes accumulated lessons.

  # living base specs — the as-built behavior contracts of the codebase,
  # one file per area: specs/base/<area>.md (template
  # $(sdd-path templates/base-spec.md)). /sdd:cleanup merges each merged
  # feature's as-built requirements in (amendments applied, blocked
  # requirements dropped), so specs stay anchored to the code instead of
  # going dormant per feature. the spec-writer quotes matching contracts
  # into new specs; the consistency critic blocks silent contradictions.
  # a missing directory just means nothing has merged yet.
  spec_base: specs/base

  # how pipeline artifacts (specs/<slug>/, a newly generated standards
  # digest) reach repo history at the commit stage:
  #   with_feature — folded into the first logical commit (solo repos)
  #   own_commit   — one separate final commit, so human reviewers can
  #                  skim or abandon it without touching the code commits;
  #                  the Requirements:/Test-Coverage: trailers keep the
  #                  traceability either way
  #   untracked    — never committed; /sdd:cleanup archives specs/<slug>/
  #                  instead. gitignore specs/ in this mode, and point
  #                  config.spec_base outside the repo or the living base
  #                  dies with it
  specs_tracking: with_feature

  # integration with github.com/pure-experimental/fw-skills
  # install: git clone the repo, then symlink its skills/* into this
  # project's .claude/skills/ (or ~/.claude/skills/ for global).
  # wherever a stage names a skill: if it is available in the session, USE IT
  # instead of reimplementing the process inline.
  fw_skills:
    unit_test: fw-run-unit-test    # build + run x86 unit tests
    hw_pytest: fw-hw-pytest        # run one hw pytest on a testbed bay
    full_pytest: fw-run-pytest     # build + flash + run + artifacts
    code_review: fw-code-review    # style/minimality pass, complements sdd review
    commit: fw-commit              # astyle + explicit staging + message format
    pr: fw-pr                      # push branch + open pr (only if user asks)

  # optional sibling key, not set here: internal_docs — see run.md's
  # "## internal docs" for what it does. a profile that extends this file
  # (see run.md's "## extends") can set it to wire in project-specific
  # research sources (Glean, Jira, Drive, Confluence, Jenkins, ...).

  # deterministic fan-out stages run as Workflow scripts (plain js). the
  # yaml stays the macro conductor — judgment, gates, git, state.md — and
  # the script guarantees what prose can only ask for: parallelism,
  # conditional rounds, withdrawal filtering, schema-validated agent
  # outputs. the values below resolve to the bundled script via
  # `sdd-path <value>`, unless a project ships its own .claude/sdd/<value>
  # override. invocation and fallback rules live in run.md; agent models
  # stay pinned in agent frontmatter (the scripts spawn via agentType,
  # never set model).
  workflows:
    research: workflows/research.js   # bundled; resolve via `sdd-path <value>`
    review: workflows/review.js       # (or a project .claude/sdd/<value> override)

  hw_test:
    testbed: null                  # e.g. fw-comet02 — set here or supply at gate 2
    bay: null                      # e.g. 19

  # optional sibling key, not set here: hw_test_heuristic (list of
  # keywords) — see run.md's "## hw-test heuristic" for what it does. a
  # profile that extends this file (see run.md's "## extends") can set it
  # to force testbed/bay at intake when the feature reads as hardware-related.

  worktree:
    enabled: true                  # /sdd:run spins off a git worktree per feature
    name_prefix: sdd/              # feature worktree + branch: sdd/<slug> under .claude/worktrees/
    # the worktree mechanics — feature-start/task-start (fetch, precondition
    # checks, EnterWorktree) and the sdd/<slug>-<id> dash-not-slash task
    # branches — are driven by sdd-git and sequenced in run.md's
    # "start or resume" + the implement stage, not restated here. /sdd:quick
    # always runs in place, no worktree.

  # gate 1 (plan approval) is normally a human checkpoint. when true, the
  # plan stage's gate: block (below) skips it automatically IF every task
  # in tasks.md is tagged complexity: simple and nothing else forces a
  # human look (see that gate's auto-approve note). the orchestrator sets
  # plan_approved: yes itself, logs why, and restates the auto-approval at
  # gate 2 so there is still one human checkpoint before commit. default
  # true: trivial plans skip gate 1 unless a project/profile sets this
  # false to restore the always-ask behavior.
  gate1_skip_if_simple: true

  # how hard the pipeline tries to RESCUE a failing task or test before it
  # gives up. a dead end (a blocked task, a still-red test halt) is the only
  # thing that ends a stage without reaching a gate, so this ladder exists to
  # make dead ends rare. every rung costs tokens, so each is BOUNDED — raise
  # the caps to trade tokens for fewer dead ends, lower them for the reverse.
  # the spend is visible at the next gate (sdd-cost --brief). the per-stage
  # mechanics live in the implement/test stages below; this block only sets
  # the dials.
  recovery:
    task_attempts: 3        # total implementer tries for one task before it
                            # blocks. 1 initial + escalating retries: retry 2
                            # re-spawns with the failure evidence and the
                            # implementer's effort bumped one tier; the LAST
                            # attempt is diagnosis-first — the orchestrator
                            # root-causes the repeated failure and amends the
                            # subspec, fixes the verify command, or decomposes
                            # the task before the final try. 1 disables the
                            # ladder (old behavior: one retry then block).
    merge_conflict: rerun   # a task-merge conflict (exit 2) means the
                            # "disjoint" file sets overlapped. rerun -> abort
                            # the isolated attempt (sdd-git task-abort) and
                            # re-run the task SERIALLY on the current feature
                            # HEAD so it builds on the merged code; block only
                            # if it still fails. block -> mark blocked at once
                            # (old behavior).
    test_fix_rounds: 2      # bounded auto-fix rounds in the test stage before
                            # the run halts. each round diagnoses first
                            # (flaky/environment -> re-run the test once, no
                            # fix task; genuine -> a fix task at escalating
                            # effort). still red after the last round -> halt
                            # and report (the one true post-gate-2 dead end).

  intake:
    # asked ONCE per feature in a single AskUserQuestion menu, before anything
    # starts — no worktree, no files, no agents until it is answered. every
    # question offers "you decide": the orchestrator resolves it itself,
    # records the choice in state.md, and restates every auto-decision at
    # gate 1 for veto. args tokens (upstream=, jira=, testbed=/bay=)
    # pre-answer their question and skip it.
    questions:
      - upstream   # base branch — options: repo default, current branch's
                   # upstream, current HEAD, free-form.
                   # you-decide -> repo default.
      - jira       # FW ticket — options: <existing id>, none yet (create
                   # before commit via fw-jira), no ticket.
                   # you-decide -> search jira for a related ticket during
                   # research and propose it at gate 1.
      - hw_test    # options: testbed+bay now, decide at gate 2, no hw tests.
                   # you-decide -> follow the test-recommender's hw_required.
      - depth      # options: full pipeline, /sdd:quick.
                   # you-decide -> pick by feature size; if quick, hand off
                   # to /sdd:quick and say so.

# context rules for every spawn live in the /sdd:run command file (run.md) —
# that is the single source; they are deliberately not restated here.

pipeline:

  - stage: research
    run_via: workflow research     # config.workflows — the script owns the fan-out
    agents: 2-4 scouts in parallel — sdd:sdd-researcher for enumeration and
      convention angles (file layout, test conventions, naming);
      sdd:sdd-researcher-deep for angles that need cross-file reasoning
      (data flow, concurrency, invariants). pick the variant per angle.
    orchestrator: >
      YOU pick the angles and the variant per angle (that is judgment and
      stays out of the script), then invoke the workflow with args
      {feature, slug, workdir, angles: [{angle, depth: enum|deep,
      learnings: [entry paths]}]}. the script runs one scout per angle in
      parallel and returns {scouts: [{angle, depth, report}],
      failed_angles}; you synthesize research.md from the reports and
      re-run any failed angle inline before synthesizing.
    input: feature description + the one assigned angle (+ any matching
      learnings from config.learnings)
    output: specs/<slug>/research.md (orchestrator synthesizes scout returns)
    fallback: Workflow tool unavailable or the run fails -> spawn the same
      scouts yourself via the Agent tool per the agents line above, and
      note it once in the final report.
    gate: none

  - stage: spec
    agents: sdd:sdd-spec-writer, then sdd:sdd-spec-critic + sdd:sdd-spec-critic-lite
      (parallel)
    input: >
      writer — slug, feature description, open questions from research.md,
      matching learnings; critics — slug only, run in parallel: sdd:sdd-spec-critic
      hunts feasibility + edge-cases, sdd:sdd-spec-critic-lite hunts testability +
      consistency (each agent file owns its focus). they read the artifacts
      themselves.
    revision: one round if any critic returns a blocking finding;
      unresolved blockers are surfaced at gate 1, not looped again
    output: specs/<slug>/spec.md
    gate: none

  - stage: plan
    agents: sdd:sdd-planner
    input: slug (reads spec.md and research.md itself) + matching learnings
    output: specs/<slug>/tasks.md + tasks table mirrored into state.md,
      each task tagged complexity simple|standard
    gate: |
      auto-approve check (config.gate1_skip_if_simple, default true): if
      true AND every task row in tasks.md is tagged complexity: simple AND
      the planner returned zero unplannable requirements AND no spec critic
      left a blocking finding unresolved -> skip the human gate below.
      `state set plan_approved yes`, then `state set gate1_auto_approved
      yes` and `state log` a one-line note (task count + titles) explaining
      why, and continue straight to implement — do not ask. This is a
      capability the config opts into, not a silent default: any task
      tagged standard, any unplannable requirement, or any unresolved
      critic blocker forces the normal human GATE 1 below regardless of the
      flag. Because there was no human look here, gate 2 (below) restates
      the auto-approval in its summary so the user still gets one
      checkpoint before commit.

      GATE 1 (human) — present plan, coverage map (including any requirements
      the planner returned as unplannable), unresolved spec blockers, and
      every intake auto-decision (for veto).
      record the outcome in state.md immediately; then this is a safe /clear
      point (resume is lossless via /sdd:run).
      routes (3 + free text — fits one AskUserQuestion):
        approve -> plan_approved: yes (unlocks source edits), continue
        modify  -> the user says what to change; YOU route it to the right
                   stage (increment gate1_reroutes, then re-present gate 1):
                     needs new facts        -> new scout angles, update
                                               research.md; spec-writer
                                               revises if findings change
                                               the spec; planner re-plans
                     requirement/scope change -> sdd:sdd-spec-writer revision,
                                               then re-plan
                     task structure change  -> sdd:sdd-planner revision only
        abort   -> stop, state preserved for later /sdd:run resume

  - stage: implement
    agents: per task — sdd:sdd-implementer or sdd:sdd-implementer-lite
      (complexity simple -> lite; standard -> implementer);
      sdd:sdd-verifier for STANDARD tasks only
    setup: >
      (1) standards digest: if config.standards_digest does not exist, spawn
      one sdd:sdd-researcher with the angle "distill config.coding_standard +
      config.comment_style into a ~50-line digest of the rules that affect
      generated code"; the orchestrator writes the digest. if the repo has
      no file at config.coding_standard, the digest is config.comment_style
      plus the conventions section of research.md — never invent rules.
      (2) subspecs: read spec.md ONCE and write one subspec per task —
      specs/<slug>/tasks/<id>.md from the subspec template — carrying the
      feature context (the spec's summary, non-goals, and constraints —
      what keeps micro-decisions aligned), the full text of the task's
      requirements, the amendments touching its files, the file list, the
      verify command, the tasks.md notes, and an interfaces section: grep
      the exact signatures, types, and registration macros the task must
      call or implement (from the files on its list and from the tasks it
      depends on) and paste them in verbatim with path:line — the
      implementer starts from contracts instead of exploring the codebase.
      an interface owned by a dependency task that has not merged yet
      cannot be grepped — copy the planned signature from tasks.md and
      mark it (planned — regenerate after T<n>); the merge step below
      regenerates it from source. implementers and verifiers
      read ONLY their subspec, never spec.md or state.md.
      (3) snapshot: `sdd-git snapshot` — commits specs/ (and
      only specs/) on the feature branch as "wip(sdd): specs snapshot" so
      task worktrees cut from it contain the digest and subspecs; record
      HEAD as base_ref in state.md if not already set. re-snapshot
      whenever an amendment changes a not-yet-started task's subspec.
    loop: >
      dependency order. a task running ALONE executes directly in the
      feature worktree. tasks running CONCURRENTLY (parallel_ok, file sets
      verified pairwise disjoint, max 3) each get an ISOLATED task worktree
      cut from the feature branch:
        sdd-git task-start <slug> <id>
        (-> .claude/worktrees/sdd/<slug>-<id>, branch sdd/<slug>-<id>)
      the implementer and verifier for a task receive workdir=<its worktree>
      and operate only inside it — isolation makes scope checks exact and
      lets verify commands (builds, tests) run concurrently without racing.
      standard implementers work test-first when their task carries tests
      (see the agent file): their return includes a red run — evidence the
      new test can fail — beside the green verify; the verifier still
      re-derives test honesty independently.
    verification: >
      standard tasks -> sdd:sdd-verifier spawned with the SAME workdir
      (independent judgment on requirement compliance, scope, test honesty).
      simple tasks -> NO spawn: the orchestrator re-runs the task's verify
      command and checks scope with git status/diff in the workdir — a
      spawn exists only where judgment is needed. on FAIL (verifier FAIL or
      orchestrator check fail) climb the config.recovery.task_attempts
      ladder before giving up (increment verify_retries per retry): the
      first retry re-spawns the implementer with the failure evidence and
      its effort bumped one tier; the LAST attempt is diagnosis-first — the
      orchestrator root-causes the repeated failure from the evidence it
      already has (stale interfaces? wrong verify command? a task too big to
      land in one pass?) and, before the final try, amends the subspec, or
      corrects the verify command, or decomposes the task into smaller
      sub-tasks appended to the state.md table (each with its own subspec).
      only when the ladder is exhausted mark the task blocked (increment
      tasks_blocked, record a learning) and continue the loop — a blocked
      task is surfaced at gate 2, never a hard halt.
    merge: >
      when a task passes verification, commit its diff with
      `sdd-git -C <workdir> wip <id> "<title>"` (the provisional
      "wip(sdd): <id> <title>" commit). for a task worktree, then
      `sdd-git task-merge <slug> <id>` — it merges --no-ff into
      the feature branch and removes the task worktree + branch. file sets
      are pairwise disjoint, so a conflict (exit 2 — the helper aborts the
      merge and keeps the task branch) means the plan's file sets
      overlapped. recover per config.recovery.merge_conflict: `rerun` ->
      `sdd-git task-abort <slug> <id>` to discard the isolated attempt, then
      re-run the task SERIALLY in the feature worktree (as a solo task does,
      building on the now-merged conflicting code) and commit with
      `sdd-git -C <feature worktree> wip <id> "<title>"`; block only if the
      serial re-run still fails verification. `block` -> mark blocked at
      once. either way increment merge_conflicts; on a block record a
      learning. the loop continues. after a merge, regenerate the ## interfaces
      section of every not-yet-started subspec whose task depends_on the
      merged task — grep the feature worktree, where the real signatures
      now exist — and re-snapshot if anything changed.
      invariant: the feature branch HEAD always contains all completed work;
      the commit stage later dissolves the wip commits into real ones.
    scope_stop: >
      implementer returns needs_files (its file list is missing something).
      YOU adjudicate — no user stop when the miss is mechanical (a header,
      build file, test registration, adjacent glue) AND the file is
      disjoint from every other non-done task's file set: amend the
      subspec's file list, log the fix in state.md (increment
      file_list_fixes), re-spawn the task. if the file overlaps another
      task's set, or the "why" smells behavioral, treat it as an ambiguity
      below. repeated misses across tasks mean the plan is wrong — record
      a learning.
    ambiguity: >
      implementer reports a BEHAVIORAL ambiguity -> the orchestrator does
      NOT stop for the user. Resolve it with best judgment (the spec's
      summary / non-goals / constraints and the surrounding code are the
      tiebreakers), record the decision as an amendment in state.md flagged
      `(assumption)` (increment ambiguities), update the affected subspecs,
      re-snapshot, re-spawn the task, and keep going. Every `(assumption)`
      amendment is restated at GATE 2 for veto — an objection there routes
      exactly like any "spec or plan wrong" gate-2 finding. An assumption
      made past gate 2 (a fix or test-fix task) goes in the final report
      instead. Only a hard blocker the orchestrator cannot resolve stops the
      pipeline, and that is an error report, not a request for input.
    gate: none

  - stage: review
    run_via: workflow review       # config.workflows — rounds 1-2 + judge + recommender
    agents: 3x sdd:sdd-reviewer (combative), sdd:sdd-review-judge,
      sdd:sdd-test-recommender — spawned BY the workflow script; round 0 and
      gate 2 stay with the orchestrator
    round_0_mechanical: >
      ORCHESTRATOR, no spawn — grep the ADDED lines of the feature diff
      (git diff <base_ref>, '+' lines only, specs/ excluded) for stub
      markers: TODO, FIXME, XXX, HACK, "not implemented", placeholder or
      hardcoded-empty returns. hits are objective findings (M1..) — they
      skip the debate and the judge and go to gate 2 as confirmed. a clean
      scan costs nothing; a spawn exists only where judgment is needed.
      the script cannot run this (no shell in workflow scripts) — do it
      BEFORE invoking the workflow.
    orchestrator: >
      after round 0, invoke the workflow with args {slug, base_ref,
      workdir: <feature worktree abs path>}. the script enforces the round
      contracts below structurally — round-1 parallelism, the conditional
      combat round, deterministic withdrawal filtering, the conditional
      judge, schema-validated json at every step — and returns {clean,
      confirmed, rejected, withdrawn, unjudged, debate, reviewer_failures,
      tests}. merge M findings with confirmed, update metrics
      (findings_confirmed, findings_rejected), and present gate 2 with the
      tests payload. non-empty unjudged means the judge died: spawn
      sdd:sdd-review-judge yourself with {slug, base_ref, findings: unjudged,
      rebuttals: debate} before gating. non-empty reviewer_failures means a
      stance never reported — re-run that stance inline; never present a
      review as clean when a stance is missing.
    round_1: >
      3 reviewers in parallel with distinct stances — breaker (correctness,
      edge cases, races), guardian (spec compliance, test honesty), attacker
      (security, robustness, failure modes). they diff against base_ref in
      the feature worktree (specs/ hunks are pipeline artifacts, not review
      targets). test-recommender runs alongside.
    round_2_combat: >
      CONDITIONAL. zero findings from round 1 -> skip round 2 AND the judge;
      report a clean review at gate 2. otherwise re-spawn ONLY the reviewers
      that have opponent findings to contest — a reviewer whose opponents
      found nothing has nothing to rebut and is not spawned. each spawned
      reviewer must refute, concede, or escalate every opponent finding and
      defend or withdraw its own.
    judge: >
      spawned only when findings survive round 2 (not withdrawn). rules on
      findings + the debate; only confirmed findings go to the user.
      record counts in metrics (findings_confirmed, findings_rejected).
    fallback: Workflow tool unavailable or the run fails -> execute
      round_1, round_2_combat, and judge yourself via the Agent tool
      exactly as written above, and note it once in the final report.
    gate: |
      GATE 2 (human) — present confirmed findings (or the clean-review
      shortcut), rejected count, and the test recommendations. if
      state.md's gate1_auto_approved is yes, restate it here in one line
      (task count/titles, from the plan stage's log note) — the user's
      first look at the plan is now this gate, so treat an objection to it
      as "spec or plan wrong" routing (below), same as any other gate-2
      finding. supply testbed/bay here if config.hw_test is empty. record
      the outcome in state.md immediately; then this is a safe /clear point.
      routes (4, finding-level, free text can mix them):
        approve            -> review_approved: yes, continue to test
        spec or plan wrong -> YOU decide which from the user's note
                              (increment gate2_reroutes): spec-level ->
                              sdd:sdd-spec-writer amends, planner re-plans
                              affected tasks; plan-level -> sdd:sdd-planner
                              revises. then implement delta -> re-review
                              delta.
        just fix the code  -> findings become fix tasks (F1.. — appended to
                              the state.md table, subspecs written like any
                              task) -> implement loop -> re-review delta
        waive              -> record under waived findings (increment
                              findings_waived, record a learning), continue

  - stage: test
    agents: none — orchestrator runs the recommended tests, via fw-skills
      when installed
    run: |
      unit tests   -> skill fw-run-unit-test (fallback: repo's unit test
                      runner inline)
      hw pytests   -> skill fw-hw-pytest with config.hw_test testbed/bay
                      (fallback: skip with an explicit warning that hw tests
                      did not run — never fake a pass)
    on_fail: >
      up to config.recovery.test_fix_rounds bounded auto-fix rounds before
      halting. each round DIAGNOSES first: a flaky or environment failure
      (nondeterministic, unrelated to the diff, testbed/setup error) -> re-run
      that test ONCE rather than spawning a fix; a genuine failure -> it
      becomes a fix task (increment test_failures) that runs the implement
      loop at escalating effort, then re-run only the failed tests. still red
      after the last round -> stop and report (the one true post-gate-2 dead
      end); the user decides. never fake a pass to avoid the halt.
    gate: none

  - stage: commit
    agents: none
    run: |
      skill fw-commit when installed (astyle, explicit staging, message
      format). fallback: when wip(sdd) commits exist (/sdd:quick has
      none), dissolve them first — `sdd-git dissolve <upstream>`
      (soft-reset to the merge-base; refuses non-wip commits in the range
      and prints the recovery sha) — then group the diff into logical
      commits with messages per config.commit_standard.
      pipeline artifacts (specs/<slug>/ and, when this feature generated
      it, specs/standards-digest.md) land per config.specs_tracking:
        with_feature -> included in the first logical commit
        own_commit   -> one SEPARATE final commit ("FW-XXXXX: sdd
                        artifacts for <slug>") after the code commits
        untracked    -> never staged; /sdd:cleanup archives specs/<slug>/
      never push; open a pr only if the user asks (skill fw-pr).
    close: >
      harvest learnings before closing: any gate reroute, blocked task,
      waived finding, or vetoed auto-decision without a learning entry gets
      one now, in whichever scope it fits (config.learnings — project vs
      global, see run.md). then phase done; delete specs/ACTIVE here
