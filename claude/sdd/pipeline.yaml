# sdd pipeline — single source of truth for how /sdd:run executes.
# this copy at ~/.claude/sdd/pipeline.yaml is the GLOBAL DEFAULT; a project
# may override it with its own .claude/sdd/pipeline.yaml (/sdd:run prefers
# the project copy).
# edit this file to reshape the pipeline (stages, models, gates, routing).
# edit .claude/agents/*.md to reshape agent behavior.
# /sdd:run interprets this file top to bottom, resuming from the phase in
# specs/<slug>/state.md.

config:
  # repo-relative; the authoritative standard
  coding_standard: docs/coding_standard.md

  # one-time distillation of the coding standard + comment style (~50 lines),
  # shared across features. generated at the start of the first implement
  # stage if missing: one haiku scout (sdd-researcher) reads
  # config.coding_standard and returns the digest; the orchestrator writes
  # it. implementers and verifiers read THIS instead of the full standard,
  # and consult the full doc only where the digest is silent or ambiguous.
  standards_digest: specs/standards-digest.md

  # derived from repo commit history. the fw-commit skill enforces this when
  # installed; the inline fallback in the commit stage follows it manually.
  # change-id is added by the gerrit hook — never fabricate it.
  commit_standard: |
    FW-XXXXX: <imperative summary, under 72 chars>

    - <bullet per logical change>

    Reasoning:
    <only when the why is not obvious from the diff>

    JIRA: FW-XXXXX
    Test-Coverage: <tests that prove the change>

  # matches the comment style in the repo's history
  comment_style: |
    - lowercase, short, rare — only where the code can't say it
      e.g.  // sum up nvme io stats
            // only set led if state is different
    - multi-line rationale blocks only for non-obvious constraints
      (alignment, timing, hw quirks, flaky-test workarounds) — still lowercase
    - never touch structural markers:
      // ::pure_astyle_formatted::   and   #endif // !UNIT_TEST

  # integration with github.com/pure-experimental/fw-skills
  # install: git clone the repo, then symlink its skills/* into this
  # project's .claude/skills/ (or ~/.claude/skills/ for global).
  # wherever a stage names a skill: if it is available in the session, USE IT
  # instead of reimplementing the process inline.
  fw_skills:
    unit_test: fw-run-unit-test    # build + run x86 unit tests
    hw_pytest: fw-hw-pytest        # run one hw pytest on a testbed bay
    full_pytest: fw-run-pytest     # build + flash + run + artifacts
    code_review: fw-code-review    # style/minimality pass, complements sdd review
    commit: fw-commit              # astyle + explicit staging + message format
    pr: fw-pr                      # push branch + open pr (only if user asks)

  hw_test:
    testbed: null                  # e.g. fw-comet02 — set here or supply at gate 2
    bay: null                      # e.g. 19

  worktree:
    enabled: true                  # /sdd:run spins off a git worktree per feature
    name_prefix: sdd/              # worktree + branch: sdd/<slug> under .claude/worktrees/
    # the worktree is cut from the intake-confirmed upstream after a fetch:
    #   git worktree add -b sdd/<slug> <path> <upstream>
    # then entered via EnterWorktree path=. /sdd:quick always runs in place —
    # no worktree; its single gate shows the current branch + upstream instead.

  intake:
    # asked ONCE per feature in a single AskUserQuestion menu, before anything
    # starts — no worktree, no files, no agents until it is answered. every
    # question offers "you decide": the orchestrator resolves it itself,
    # records the choice in state.md, and restates every auto-decision at
    # gate 1 for veto. args tokens (upstream=, jira=, testbed=/bay=)
    # pre-answer their question and skip it.
    questions:
      - upstream   # base branch — options: repo default, current branch's
                   # upstream, current HEAD, free-form.
                   # you-decide -> repo default.
      - jira       # FW ticket — options: <existing id>, none yet (create
                   # before commit via fw-jira), no ticket.
                   # you-decide -> search jira for a related ticket during
                   # research and propose it at gate 1.
      - hw_test    # options: testbed+bay now, decide at gate 2, no hw tests.
                   # you-decide -> follow the test-recommender's hw_required.
      - depth      # options: full pipeline, /sdd:quick.
                   # you-decide -> pick by feature size; if quick, hand off
                   # to /sdd:quick and say so.

# context rules for every spawn:
# - agents get ONLY what their agent file's "inputs" contract lists —
#   task/stage data as compact json, plus file paths to read. never paste
#   whole artifacts, other agents' full returns, or conversation history
#   into a prompt; unneeded context poisons the output.
# - exception where excerpts beat reads: the task json for implementers and
#   verifiers carries the full TEXT of its requirements and relevant
#   amendments (the orchestrator reads spec.md once and extracts), so those
#   agents never read spec.md or state.md.

pipeline:

  - stage: research
    agents: sdd-researcher (haiku) or sdd-researcher-deep (sonnet), 2-4 in parallel
    model_rule: >
      per angle — haiku for enumeration and convention scouting (file layout,
      test conventions, naming); sonnet deep-variant for angles that need
      cross-file reasoning (data flow, concurrency, invariants).
    input: feature description + the one assigned angle
    output: specs/<slug>/research.md (orchestrator synthesizes scout returns)
    gate: none

  - stage: spec
    agents: sdd-spec-writer (opus), then 2x sdd-spec-critic (opus, parallel)
    input: >
      writer — slug, feature description, open questions from research.md;
      critics — slug only (they read the artifacts themselves)
    revision: one round if any critic returns a blocking finding;
      unresolved blockers are surfaced at gate 1, not looped again
    output: specs/<slug>/spec.md
    gate: none

  - stage: plan
    agents: sdd-planner (opus)
    input: slug (reads spec.md and research.md itself)
    output: specs/<slug>/tasks.md + tasks table mirrored into state.md,
      each task tagged complexity simple|standard
    gate: |
      GATE 1 (human) — present plan, coverage map, unresolved spec blockers,
      and every intake auto-decision (for veto).
      record the outcome in state.md immediately; then this is a safe /clear
      point (resume is lossless via /sdd:run).
      routes:
        approve          -> plan_approved: yes (unlocks source edits), continue
        more research    -> user's question becomes new scout angles; update
                            research.md; spec-writer revises if findings change
                            the spec; planner re-plans
        change the spec  -> sdd-spec-writer revision with the user's input, re-plan
        change the plan  -> sdd-planner revision with the user's input
        abort            -> stop, state preserved for later /sdd:run resume

  - stage: implement
    agents: per task — sdd-implementer (sonnet) or sdd-implementer-lite (haiku);
      sdd-verifier (sonnet) for STANDARD tasks only
    model_rule: complexity simple -> lite (haiku); standard -> implementer (sonnet)
    setup: >
      (1) if config.standards_digest does not exist: spawn one sdd-researcher
      (haiku) with the angle "distill config.coding_standard +
      config.comment_style into a ~50-line digest of the rules that affect
      generated code"; orchestrator writes the returned digest to the
      configured path. (2) read spec.md once and build each task's json with
      the full text of its requirements and the amendments touching its
      files.
    loop: >
      dependency order; up to 3 concurrent only when parallel_ok and file sets
      are verified pairwise disjoint.
    verification: >
      standard tasks -> sdd-verifier spawn (independent judgment on
      requirement compliance, scope, test honesty). simple tasks -> NO spawn:
      the orchestrator itself re-runs the task's verify command and checks
      scope with git diff --stat — a spawn exists only where judgment is
      needed. verifier FAIL (or orchestrator check fail) -> one retry with
      the failure evidence -> second FAIL marks task blocked, loop continues.
    ambiguity: implementer reports it -> orchestrator stops the loop, asks the
      user, records an amendment in state.md, resumes
    gate: none

  - stage: review
    agents: 3x sdd-reviewer (sonnet, combative), sdd-review-judge (opus),
      sdd-test-recommender (sonnet) — rounds are CONDITIONAL, see below
    round_1: >
      3 reviewers in parallel with distinct stances — breaker (correctness,
      edge cases, races), guardian (spec compliance, test honesty), attacker
      (security, robustness, failure modes). test-recommender runs alongside.
    round_2_combat: >
      CONDITIONAL. zero findings from round 1 -> skip round 2 AND the judge;
      report a clean review at gate 2. otherwise re-spawn ONLY the reviewers
      that have opponent findings to contest — a reviewer whose opponents
      found nothing has nothing to rebut and is not spawned. each spawned
      reviewer must refute, concede, or escalate every opponent finding and
      defend or withdraw its own.
    judge: >
      spawned only when findings survive round 2 (not withdrawn). rules on
      findings + the debate; only confirmed findings go to the user.
    gate: |
      GATE 2 (human) — present confirmed findings (or the clean-review
      shortcut), rejected count, and the test recommendations. supply
      testbed/bay here if config.hw_test is empty. record the outcome in
      state.md immediately; then this is a safe /clear point.
      routes (finding-level, can mix):
        approve            -> review_approved: yes, continue to test
        spec is wrong      -> sdd-spec-writer amends spec -> planner re-plans
                              affected tasks -> implement delta -> re-review delta
        plan is wrong      -> sdd-planner revises -> implement delta -> re-review delta
        just fix the code  -> findings become fix tasks (F1..) -> implement loop
                              -> re-review delta
        waive              -> record under waived findings, continue

  - stage: test
    agents: none — orchestrator runs the recommended tests, via fw-skills
      when installed
    run: |
      unit tests   -> skill fw-run-unit-test (fallback: repo's unit test
                      runner inline)
      hw pytests   -> skill fw-hw-pytest with config.hw_test testbed/bay
                      (fallback: skip with an explicit warning that hw tests
                      did not run — never fake a pass)
    on_fail: >
      one auto-fix round — failures become fix tasks, implement loop, re-run
      only the failed tests. still red -> stop and report; the user decides.
    gate: none

  - stage: commit
    agents: none
    run: |
      skill fw-commit when installed (astyle, explicit staging, message
      format). fallback: group the diff into logical commits, messages per
      config.commit_standard, include specs/<slug>/ in the first commit.
      never push; open a pr only if the user asks (skill fw-pr).
    close: >
      phase done; delete specs/ACTIVE here and the worktree-pointer
      specs/ACTIVE in the main checkout (first path in `git worktree list`)
      if one exists. report the commit list, the branch + worktree path, and
      anything waived, blocked, or skipped. KEEP the worktree — removal
      (ExitWorktree / git worktree remove) is the user's call after the pr
      merges.
