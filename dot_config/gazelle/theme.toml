# Catppuccin Mocha theme for Gazelle.
# Gazelle maps normal.red to its primary color and normal.yellow to its accent.
[colors.primary]
foreground = "#cdd6f4"
background = "#1e1e2e"

[colors.normal]
black = "#45475a"
red = "#cba6f7"
green = "#a6e3a1"
yellow = "#89b4fa"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#cba6f7"
cyan = "#94e2d5"
white = "#cdd6f4"

[styles]
dialog_border = "round"
section_border = "round"
