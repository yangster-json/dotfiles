id = "dotfiles.clock"
name = "Clock"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "LA time in the sidebar, replacing the tmux status-right date module"
platforms = ["linux", "macos"]

# herdr has no status bar, so a $time workspace metadata token in
# ui.sidebar.spaces.rows is the only surface a clock can render in. the startup
# hook spawns the updater detached, because hooks are one-shot and must exit.
[[startup]]
command = ["sh", "-c", "nohup setsid sh clock.sh >/dev/null 2>&1 &"]

[[actions]]
id = "refresh"
title = "Refresh clock"
contexts = ["global"]
command = ["sh", "clock.sh", "--once"]
