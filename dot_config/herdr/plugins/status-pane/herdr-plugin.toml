id = "dotfiles.status-pane"
name = "Clock"
version = "0.3.0"
min_herdr_version = "0.7.0"
description = "LA date and time in the workspace sidebar"
platforms = ["linux", "macos"]

[[startup]]
command = ["sh", "-c", "nohup setsid sh status-pane.sh >/dev/null 2>&1 &"]

[[actions]]
id = "refresh"
title = "Refresh clock"
contexts = ["global"]
command = ["sh", "status-pane.sh", "--once"]
