theme:
  activeBorderColor:
    - '#cba6f7'
    - bold
  inactiveBorderColor:
    - '#a6adc8'
  searchingActiveBorderColor:
    - '#f9e2af'
  optionsTextColor:
    - '#89b4fa'
  selectedLineBgColor:
    - '#313244'
  inactiveViewSelectedLineBgColor:
    - '#6c7086'
  cherryPickedCommitFgColor:
    - '#cba6f7'
  cherryPickedCommitBgColor:
    - '#45475a'
  markedBaseCommitFgColor:
    - '#89b4fa'
  markedBaseCommitBgColor:
    - '#f9e2af'
  unstagedChangesColor:
    - '#f38ba8'
  defaultFgColor:
    - '#cdd6f4'
  authorColors:
    '*': '#b4befe'
git:
  # cycle with | (reverse \)
  diffRenderers:
    - name: delta
      command: delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    - name: delta split
      command: delta --dark --paging=never --side-by-side --width={{columnWidth}}
    - name: difftastic
      type: extDiff
      command: difft --color=always --background=dark --context={{diffContext}}
    - name: raw
      type: rawGit
